# ===========================================================================
# OCR 关键词与识别规则
# ===========================================================================
# 用途：模板匹配负责「按钮/图标」等固定元素；OCR 负责「文本/数值」等
#       动态内容，两者互补。文本类判定比模板匹配更抗分辨率/版本变化。
#
# 字段说明
#   keywords      必须命中的关键词（任一命中即算通过，any 语义）
#   all_keywords  必须全部命中
#   exclude       命中任一则否决
#   regex         正则规则（用于数值抽取）
#   region        识别区域 [x1,y1,x2,y2]（基准分辨率）；不写=全屏
#   min_score     覆盖全局置信度阈值
#   desc          用途说明
# ---------------------------------------------------------------------------
# 注意：以下为占位框架，关键词需在真实界面上采集后填写。
#       游戏中大量使用美术字体，OCR 结果可能不稳定，届时以「短词 + 高阈值
#       + 关键区域裁剪」组合来提高鲁棒性。
# ---------------------------------------------------------------------------

meta:
  engine: rapidocr
  base_resolution: [1920, 1080]
  normalize: true          # 去空白、全半角统一后再比对

rules: {}

