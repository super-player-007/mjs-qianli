# ===========================================================================
# 固定按钮 / 坐标表
# ===========================================================================
# 坐标系说明
#   - 原点：屏幕左上角 (0,0)
#   - 单位：像素
#   - 基准：1920 x 1080（与 settings.yaml 的 screen.base_width/height 对应）
#        运行时按 实际分辨率 / 基准分辨率 自动等比缩放，无需手改
#
# 采集方法
#   tools/capture.py       抓图（--grid 叠加网格便于读坐标）
#   tools/make_template.py 裁模板
#   OCR 批量量坐标：见 README「OCR 关键词与规则」
#
# 结构约定
#   type: point   单点点击        xy: [x, y]
#   type: region  区域(匹配/OCR)  box: [x1,y1,x2,y2]
#   type: options 一组候选点      points: [[x,y], ...]
#   template      关联的模板素材名（相对 assets/templates，可省 .png）
#   desc          用途说明
# ---------------------------------------------------------------------------
# 标定信息
#   calibrated_on : 2026-09-16
#   分辨率        : 1920x1080 (DPI 280)，与模拟器物理分辨率一致，无需缩放
#   游戏包名      : com.ztgame.mjs
# ---------------------------------------------------------------------------

meta:
  base_resolution: [1920, 1080]
  calibrated_on: "2026-09-16"
  dpi: 280
  package: "com.ztgame.mjs"
  note: "所有坐标均为实测值，非估算"

# ===========================================================================
# 全局通用元素（所有子页面共用）
# ===========================================================================
common:
  back_button:
    type: point
    xy: [1841, 138]
    desc: >-
      【重要】游戏内返回键位于**右上角**（非常规的左上角），是一枚半透明金色图标。
      实测：在「战役页」「千里单骑入口页」两页中心坐标一致 (1840,139)/(1844,139)，
      取均值 (1841,138)。
      注意：Android 系统返回键（adb keyevent 4）在游戏内**无效**，必须点击此图标。
      由于该图标半透明、会叠在不同背景上（红幡/天空），模板匹配不可靠，
      因此采用**固定坐标点击 + 点击后界面校验**的方式，可靠性由事后验证保证。

screens:

  # =====================================================================
  # 主界面（游戏大厅）
  # =====================================================================
  home:
    desc: "游戏主大厅，中部四入口卡片轮播：竞技 / 房间 / 战役 / 煮酒"
    # --- 中部四入口卡片（居中卡片会高亮放大，但坐标稳定，实测不漂移）---
    battle_entry:
      type: point
      xy: [1473, 631]
      template: "home/battle_entry.png"
      desc: "「战役」卡片。实测模板匹配 0.976~0.999，多项挑战的入口"
    arena_entry:
      type: point
      xy: [1023, 617]
      desc: "「竞技」卡片（新赛季进行中），暂未使用"
    room_entry:
      type: point
      xy: [1255, 614]
      desc: "「房间」卡片（自由组合身份），暂未使用"
    banquet_entry:
      type: point
      xy: [1733, 613]
      desc: "「煮酒」卡片（战场机制玩法），暂未使用"
    # --- 顶部/底部导航（暂未使用，备用）---
    nav_ask:      { type: point, xy: [1256, 271], desc: "问策" }
    nav_activity: { type: point, xy: [1376, 271], desc: "活动" }
    nav_shop:     { type: point, xy: [1495, 271], desc: "商店" }
    nav_recruit:  { type: point, xy: [1848, 271], desc: "招募" }

  # =====================================================================
  # 战役页（点击主页「战役」后进入）
  # =====================================================================
  campaign:
    desc: "战役页，四张玩法卡片：千里单骑 / 龚行天罚 / 武侯讲武 / 山河争锋"
    qianli_card:
      type: point
      xy: [705, 598]
      template: "campaign/qianli_card.png"
      box: [560, 330, 880, 690]
      desc: "「千里单骑」卡片（单人挑战玩法）。本次自动化的目标入口"
    gongxing_card:
      type: point
      xy: [942, 599]
      desc: "「龚行天罚」卡片（组队挑战玩法），暂未使用"
    wuhou_card:
      type: point
      xy: [1157, 609]
      desc: "「武侯讲武」卡片（试炼挑战玩法），暂未使用"
    shanhe_card:
      type: point
      xy: [1412, 599]
      desc: "「山河争锋」卡片（战役进行中），暂未使用"
    # --- 通用返回键（右上角金色图标）---
    back:
      type: point
      xy: [1841, 138]
      desc: "返回键（右上角）→ 回主界面（游戏大厅）"
    # --- 二级入口（挂机脚本用不到，备用）---
    battle_shop:
      type: point
      xy: [55, 175]
      desc: "左上「战役商店」入口，暂未使用"

  # =====================================================================
  # 千里单骑 入口页（点击「千里单骑」后进入）
  # =====================================================================
  qianli:
    desc: "千里单骑入口页：选择武将 + 难度选择 + 开始挑战"
    # --- 打开武将选择：点「战役属性」上方的武将立绘 ---
    hero_card:
      type: point
      xy: [1622, 501]
      desc: >-
        【重要】点右侧卡片上 **「战役属性」上方的武将立绘** 任意位置 → 打开武将选择页。
        实测 2026-09-16 生效（点 (1622,501) 直接进入选将页）。
        定位依据：OCR「战役属性」中心 (1660,766)，本点在其上方约 265px（立绘中部偏上）。
        边界约束：x < 1790（右侧竖排绿色珠子列）、y > 400（顶部「西楚」标签与龙纹）。
        注意：不要点卡片上的竖排武将名（x≈1552）与「切换」小按钮，二者语义不同。
    switch_hero:
      type: point
      xy: [1472, 791]
      desc: "「切换」按钮（卡片左下小按钮，实测 (1472,791)；与点立绘等价，备用）"
    # --- 难度选择（壹~捌）---
    difficulty_left:
      type: point
      xy: [1243, 859]
      desc: "难度减一（左箭头）"
    difficulty_right:
      type: point
      xy: [1457, 859]
      desc: "难度加一（右箭头）"
    difficulty_value:
      type: region
      box: [1310, 810, 1395, 900]
      desc: "当前难度数值显示区（汉字：壹~捌），OCR 读取"
    # --- 开始挑战 ---
    start_challenge:
      type: point
      xy: [1670, 921]
      template: "qianli/start_challenge.png"
      desc: "「开始挑战」主按钮。右侧显示「挑战所需 N/1」表示天命令消耗"
    cost_area:
      type: region
      box: [1710, 825, 1780, 872]
      desc: "「挑战所需」数量显示区（如 76/1），OCR 读取"
    # --- 状态显示 ---
    order_count:
      type: region
      box: [1660, 110, 1712, 155]
      desc: "顶部天命令数量（如 76）"
    endless_badge:
      type: region
      box: [50, 198, 195, 325]
      desc: "左上「无尽 / 32」徽章（无尽模式进度，暂未使用）"
    back:
      type: point
      xy: [1841, 138]
      desc: "返回键（右上角金色图标）→ 回战役页。实测点击生效，见 common.back_button 说明"

  # =====================================================================
  # 武将选择页（点击入口页「选择武将」卡片后进入）
  # =====================================================================
  # 页面结构（1920x1080 实测）
  #   左上：千里单骑标题 | 左侧：战役属性面板(至 x≈310)
  #   中间：武将预览大图  | 右侧：当前武将大卡(自 x≈1470)
  #   底部：武将选择标题栏(y≈656) / 筛选页签(y≈724) / 搜索框 / 武将网格(y≥780)
  # ---------------------------------------------------------------------
  hero_select:
    desc: "武将选择页：选武将 + 查看战役属性 + 难度选择 + 开始挑战"

    # --- 【退出/确认】点击中间预览大图任意位置 = 关闭本页并确认当前选中武将 ---
    exit_zone:
      type: region
      box: [350, 200, 1400, 620]
      desc: >-
        【重要】点击此区域**任意位置**即可退出武将选择界面，同时**确认**当前选中的武将。
        实测点 (880,400) 生效——游戏把它当作"点击空白处关闭"。
        区域边界必须避开三处占用：左侧「战役属性」面板(至 x≈310)、
        右侧武将大卡(自 x≈1470)、底部「武将选择」分隔栏(y≥640)。
        本 box 已四向内缩留出余量，如改分辨率需重新核对。
    exit_point:
      type: point
      xy: [880, 400]
      desc: "退出/确认点击点（exit_zone 中心；脚本实际只点这一个点）"
    close_via_blank:
      type: point
      xy: [880, 400]
      desc: "同 exit_point，语义别名：点空白关闭"

    # --- 阶层筛选页签（全部 / 初 / 壹 / 贰 / 叁 / 肆 / 伍 / 陆）---
    tabs:
      y: 724
      x0: 213
      step: 133.2
      items: ["全部", "初", "壹", "贰", "叁", "肆", "伍", "陆"]
      desc: >-
        阶层筛选页签。实测中心 x = 213 + 133.2*n（全部213 初346 壹479 贰613
        叁744 肆878 伍1011 陆1145），y 均为 724。"全部"= 已拥有武将全量（30 格）。

    # --- 搜索（备用；中文输入需 ADBKeyboard，当前不用，靠网格 OCR 定位）---
    search_box: { type: point, xy: [1445, 726], desc: "搜索输入框（备用）" }
    search_btn: { type: point, xy: [1741, 727], desc: "搜索按钮（备用）" }

    # --- 武将网格（15 列 x 2 行 = 30 格）---
    grid:
      x0: 201          # 第 1 列头像中心 x
      y0: 812          # 第 1 行头像中心 y
      dx: 111          # 列间距
      dy: 124          # 行间距
      cols: 15
      rows: 2
      name_dy: 56      # 名字中心相对头像中心的 y 偏移（名字在头像下方）
      region: [150, 780, 1810, 1035]   # 网格 OCR 区域（含头像与名字）
      desc: >-
        15 列 x 2 行 = 30 格。实测列中心 x = 201 + 111*n（201,312,423,...,1754）；
        行头像中心 y = 812（第1行）/ 936（第2行），名字行 y=868 / 992。
        ⚠ 点击目标必须是**头像中心**（点头像上方的立绘区域），实测点名字无效。

    # --- 页面按钮 ---
    difficulty_btn: { type: point, xy: [1354, 937], desc: "「难度选择」按钮（打开难度选择）" }
    start_btn:      { type: point, xy: [1663, 924], desc: "「开始挑战」按钮（需已选武将才会亮）" }

    # --- 右侧武将大卡：用于回读校验选中结果 ---
    hero_card_name:
      type: region
      box: [1505, 240, 1590, 390]
      rotate: 90
      desc: >-
        右侧大卡的**竖排**武将名（钟离昧/季布 所在位置），用于校验选择结果。
        必须旋转 90° 后 OCR（RapidOCR 自带方向分类器，顺/逆时针均可读通）。
        实测旋转后识别置信度 0.93~0.96，可稳定读出「钟离昧」。
    hero_card_area:
      type: region
      box: [1470, 100, 1800, 480]
      desc: "右侧武将大卡整体（含阵营标签、竖排名、阶数；备用）"

  # =====================================================================
  # 局内地图页（点入口页「开始挑战」后进入）
  # =====================================================================
  # 页面结构（1920x1080 实测 2026-09-16，本局为 第1层 / 3 个战斗节点）
  #   顶部：标题「千里单骑 · 无尽N」+ 右上两个资源数
  #   图例行 y≈258：战斗 / 商店 / 事件 / 休息 / 武将 / 伙伴
  #   左侧：当前挑战层数 + 武将卡 + 背包/仓库/增益
  #   中部：纵向节点列表（每层若干可选节点，★决策点）
  #   右下：「结束挑战」
  # ---------------------------------------------------------------------
  run_map:
    desc: "局内地图页：本层节点选择。节点类型与数量每层变化，位置为固定纵向列"

    # --- 标题与图例 ---
    title:
      type: region
      box: [70, 75, 415, 125]
      desc: "标题「千里单骑 · 无尽N」，OCR 可读出当前无尽层数（实测 conf=1.00）"
    legend:
      type: region
      box: [925, 240, 1730, 278]
      desc: >-
        顶部图例一行：「战斗·商店·事件·休息·武将·伙伴」。
        实测各图标中心 x：战斗980 / 商店1125 / 事件1279 / 休息1429 / 武将1567 / 伙伴1696，y 均 258。
        ⚠ 这是**图例说明**（不可点），不是当前可选节点，别误当成按钮。

    # --- 本层节点列（★决策点）---
    nodes:
      type: options
      x: 667
      y0: 397
      dy: 169.5
      max: 6
      points: [[667, 397], [667, 567], [665, 736]]
      icon_offset: [0, 40]
      icon_size: [35, 30]
      desc: >-
        节点为**圆形武将头像**，纵向单列排列。2026-09-16 霍夫圆复测：
        圆心 (667,397) / (669,567) / (665,736)，r≈44~48，间距 169.5。
        ⚠ 早先记录的 (631, 376, dy=151) 有误，已废弃。
        **类型标识在头像正下方约 40px**（图标中心 = 圆心 + (0,40)）：
        战斗=双刀 / 商店=铜钱串 / 事件=钱袋；休息、武将、伙伴待补。
        类型判定见 src/game/node_icon.py（霍夫圆定位 + 真实节点图标模板匹配，
        阈值 0.65；实测跨节点 0.86~0.89，非节点区域最高仅 0.48）。
        数量与类型每层变化 → 必须识别，不能只看坐标。
        点击节点 = 进入该节点（战斗则开打）——属决策点，脚本须暂停提问。

    # --- 左侧面板 ---
    layer_label:
      type: region
      box: [195, 268, 425, 315]
      desc: "「当前挑战：N层」，OCR 读取当前层数（实测 conf=0.98）"
    hero_card_small:
      type: point
      xy: [212, 534]
      desc: "左侧小武将卡（竖排武将名所在），点开可能为查看/切换武将（未实测）"
    switch_hero:
      type: point
      xy: [516, 813]
      desc: "「切换」按钮（左侧面板内，实测 OCR 中心 (516,813)）"
    bag:
      type: region
      box: [245, 825, 340, 862]
      desc: "「背包 N/8」容量显示（OCR）"
    warehouse:
      type: region
      box: [245, 858, 355, 892]
      desc: "「仓库 N/99」容量显示（OCR）"
    buff_entry:
      type: point
      xy: [414, 887]
      desc: "「增益」入口（左侧面板右下，点开查看已获增益；未实测）"

    # --- 右下角 ---
    end_run:
      type: point
      xy: [1632, 871]
      desc: "「结束挑战」按钮（主动结算本局，★高风险决策点）"
    scroll_bar:
      type: region
      box: [1790, 100, 1830, 620]
      desc: "地图右侧滚动条；节点多于可视区时可上滑拖动（未实测）"

  # -------------------------------------------------------------------------
  # 战斗前置确认页（battle_confirm）
  # 点地图节点后先弹这一页，展示**对手武将预览 + 属性加成 + 战斗主题**，
  # 点「开始对局」才真正开打；点「再想一想」取消返回地图。
  # 实测 2026-09-16，第 1 层节点3 → 对手「项羽」（西楚，0/3 星），主题「破釜沉舟」。
  # -------------------------------------------------------------------------
  battle_confirm:
    desc: "战斗前置确认页：对手武将卡 + 战役属性 + 主题文案 + 开始/取消"

    # --- 对手信息 ---
    enemy_card:
      type: region
      box: [625, 100, 945, 560]
      desc: "左侧对手武将大卡整体（含阵营标签、竖排名、星级；备用）"
    enemy_faction:
      type: region
      box: [685, 160, 755, 193]
      desc: "对手阵营标签，如「西楚」（OCR conf=1.00）"
    enemy_name:
      type: region
      box: [699, 252, 738, 333]
      desc: "对手武将名（**竖排**），如「项羽」（OCR conf=1.00，RapidOCR 自带方向纠正）"
    enemy_star:
      type: region
      box: [692, 506, 759, 549]
      desc: "对手星级 N/3（OCR）。本局项羽 0/3（未升星）"

    # --- 属性面板 ---
    attr_title:
      type: region
      box: [993, 185, 1155, 218]
      desc: >-
        「战役属性」标题。⚠ OCR 实测读成「战没属性」conf=0.88 —— 美术字，
        不要用这几个字做界面锚点关键词。
    attr_values:
      type: region
      box: [970, 240, 1175, 530]
      desc: >-
        8 行属性数值区（每行「名称：+N」，x≈976 名称 / x≈1150 数值）：
        速度 / 初始手牌 / 摸牌 / 手牌上限 / 体力上限 / 杀的伤害 / 战法增伤 / 出杀次数。
        本局全部 +0。数值框中心 y：261 / 297 / 333 / 369 / 404 / 440 / 474 / 510。

    # --- 主题 ---
    theme:
      type: region
      box: [896, 660, 1021, 697]
      desc: "战斗主题名，本局「破釜沉舟」（OCR conf=1.00）"
    theme_desc:
      type: region
      box: [690, 735, 1219, 763]
      desc: "主题文案，本局「今日退无可退，哪怕战死，也绝不过江东！」（OCR conf=1.00）"

    # --- 按钮 ---
    start_battle:
      type: point
      xy: [708, 920]
      desc: "「开始对局」按钮（主操作，进入战斗）。实测 OCR 中心 (708,920)"
    cancel:
      type: point
      xy: [1213, 919]
      desc: "「再想一想」按钮（取消，返回地图页）。实测 OCR 中心 (1213,919)"

  # -------------------------------------------------------------------------
  # 战斗界面（battle）
  # 实测 2026-09-16，第 1 层 vs 项羽（西楚）。
  # 布局：左上轮次+血量、上方对手卡、右下我方卡、右侧技能、底部手牌。
  # -------------------------------------------------------------------------
  battle:
    desc: "战斗进行中：自动战斗，脚本只观察；遇换牌/出牌决策点则暂停提问"

    round_label:
      type: region
      box: [114, 87, 196, 122]
      desc: "左上「第N轮」（OCR conf=0.98）"
    hp:
      type: region
      box: [104, 118, 201, 147]
      desc: "我方血量 N/M（OCR conf=0.99）。实测 158/162"
    enemy_name:
      type: region
      box: [865, 157, 893, 217]
      desc: "上方对手武将名（竖排），如「项羽」（OCR conf=0.98）"
    enemy_faction:
      type: region
      box: [858, 96, 900, 114]
      desc: "对手阵营标签，如「西楚」（OCR conf=0.98）"
    resource:
      type: region
      box: [1318, 435, 1391, 468]
      desc: "右侧资源数（OCR conf=1.00）。实测 3261"
    self_name:
      type: region
      box: [1694, 743, 1722, 831]
      desc: "右下方我方武将名（竖排），如「钟离昧」（OCR conf=0.92）"
    skills:
      type: options
