# ===========================================================================
# 导航：主页 → 战役 → 千里单骑（纯固定坐标）
# ===========================================================================
# 这三个页面的入口位置**固定不变**，实测反复点击都稳定命中，因此只用坐标：
# 不做模板锚点、不做 OCR 兜底、不做每步落点验证。
# 前进 = 2 次点击，回退 = 2 次点击；实测前进 6.0s / 回退 6.1s（含界面等待）。
#
# ⚠ 已知代价（有意为之）：纯坐标方案必须知道「当前在哪一页」。
#    调用方通过 --from 声明起点（默认 home）；声明与实际不符时点击会落空。
#    排查方式：抓一张图看一眼（run.py capture），不要往这条链上加识别逻辑。
#
# chain : 页面顺序（由浅到深）
# steps : 前进边 —— 在 <页面> 点击 <元素>，等待 wait 秒
# back  : 回退边 —— 在 <页面> 点击右上角返回键，等待 wait 秒
# ---------------------------------------------------------------------------
nav:
  chain: [home, campaign, qianli]
  steps:
    home:
      screen: home
      element: battle_entry
      wait: 1.6
      desc: "点「战役」卡片 @(1473,631)"
    campaign:
      screen: campaign
      element: qianli_card
      wait: 1.6
      desc: "点「千里单骑」卡片 @(705,598)"
  back:
    campaign:
      screen: campaign
      element: back
      wait: 1.5
      desc: "点右上角返回键 @(1841,138) → 回主界面"
    qianli:
      screen: qianli
      element: back
      wait: 1.5
      desc: "点右上角返回键 @(1841,138) → 回战役页"

